name: LLM foundations lab
on:
  push:
    paths: ["labs/**", ".github/workflows/labs.yml"]
  pull_request:
    paths: ["labs/**", ".github/workflows/labs.yml"]
jobs:
  lab:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/llm-foundations
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked
      - run: ATLAS_LAB_IMPL=reference uv run pytest -q
      - run: uv run python check_mutants.py
