[project]
name = "atlas-llm-foundations-lab"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "torch>=2.5", "pytest>=8.0"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
